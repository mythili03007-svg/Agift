<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Only Us ❤️</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: Georgia, serif;
      background: linear-gradient(135deg, #180710, #641d3c, #210b17);
      color: #fff0f5;
    }

    .card {
      width: 100%;
      max-width: 380px;
      padding: 35px 25px;
      text-align: center;
      border: 1px solid #c78ba5;
      border-radius: 22px;
      background: rgba(30, 5, 18, 0.85);
      box-shadow: 0 15px 45px #0007;
    }

    .heart {
      font-size: 55px;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 30px;
      font-weight: normal;
      margin: 10px 0;
    }

    p {
      color: #e8bdce;
      line-height: 1.7;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #c78ba5;
      border-radius: 10px;
      margin-bottom: 15px;
      font-size: 16px;
      outline: none;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #e8b2c7;
      color: #32101f;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #message {
      margin-top: 18px;
      color: #ffb7ce;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="card">
    <div class="heart">💗</div>

    <h1>Only Us</h1>

    <p>
      A little world made just for you and me.<br>
      Enter our secret password, AK ❤️
    </p>

    <form id="loginForm">
      <input
        type="password"
        id="password"
        placeholder="Enter password"
        required
      >

      <button type="submit">
        Unlock Our Love ♡
      </button>
    </form>

    <div id="message"></div>
  </div>

  <script>
    const correctPassword = "AkLovesMadam@0318";

    document.getElementById("loginForm")
      .addEventListener("submit", function(event) {

        event.preventDefault();

        const enteredPassword =
          document.getElementById("password").value;

        if (enteredPassword === correctPassword) {
          window.location.href = "home.html";
        } else {
          document.getElementById("message").textContent =
            "Wrong password, try again 💕";
        }
      });
  </script>

</body>
</html>
